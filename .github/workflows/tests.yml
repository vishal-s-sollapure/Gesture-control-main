name: GestureControl AI CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Headless Unit Tests & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Compilation Verification
        run: |
          python -m compileall core/ controls/ ui/ utils/ ml/ tests/ config.py main.py

      - name: Execute Automated Unit Test Suite
        run: |
          python -m unittest discover tests
